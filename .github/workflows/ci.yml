name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run screenshots:check
      - name: Package release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run package:release -- "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: release
          path: .artifacts/releases/${{ github.ref_name }}/
          if-no-files-found: error

  release:
    name: Release
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$RELEASE_TAG"
          --generate-notes
